name: SteamMaster DSP Foundation Tests
on:
  push:
  pull_request:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build }} --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build
        run: cmake --build build-asan --parallel 2
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
