name: SteamMaster Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [ui-development-assets-integration]
    paths:
      - 'plugin/**'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-steammaster-vst3.yml'
jobs:
  windows-vst3:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release VST3 and test suite
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSTEAMMASTER_BUILD_VST3=ON -DBUILD_TESTING=ON
      - name: Build Release
        run: cmake --build build --config Release --parallel 4
      - name: DSP and host regression suite
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst) { throw "Windows VST3 bundle was not produced" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path $vst.FullName -Destination dist -Recurse
          Get-ChildItem -Path dist -Recurse | Select-Object FullName
      - uses: actions/upload-artifact@v4
        with:
          name: SteamMaster-Windows-VST3-Release
          path: dist/
          if-no-files-found: error
          retention-days: 30
