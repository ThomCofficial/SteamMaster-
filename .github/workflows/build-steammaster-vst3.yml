name: SteamMaster Windows VST3 — production artwork
on:
  workflow_dispatch:
concurrency:
  group: steammaster-vst3-production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify real approved artwork before compiling
        shell: pwsh
        run: |
          $names = @('global_header','ocean','furnace','parametric','pultec','shadow','exciter','bax','tape','stereo_limiter')
          $missing = @()
          foreach ($name in $names) {
            $path = "plugin/assets/$name.png"
            if (!(Test-Path $path)) {
              $missing += $path
              continue
            }
            $file = Get-Item $path
            if ($file.Length -lt 10240) {
              throw "Invalid/placeholder image: $path is only $($file.Length) bytes. Approved full-resolution assets required."
            }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path).Path)
            $pngSignature = [byte[]](137,80,78,71,13,10,26,10)
            for($i=0;$i -lt 8;$i++) {
              if($bytes[$i] -ne $pngSignature[$i]) { throw "Not a PNG: $path" }
            }
            Write-Host "VERIFIED $path ($($file.Length) bytes)"
          }
          if ($missing.Count -gt 0) {
            throw "Real SteamMaster artwork is missing: $($missing -join ', '). No placeholder build will be produced."
          }
      - name: Configure Release VST3 and test suite
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSTEAMMASTER_BUILD_VST3=ON -DBUILD_TESTING=ON
      - name: Build Release
        run: cmake --build build --config Release --parallel 4
      - name: DSP and plugin host regression suite
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst) { throw "Windows VST3 bundle was not produced" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path $vst.FullName -Destination dist -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: SteamMaster-Windows-VST3-Real-Artwork
          path: dist/
          if-no-files-found: error
          retention-days: 30
